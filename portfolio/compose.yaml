# portfolio.3dbruckner.de: portfolio (https://github.com/3D-Bruckner/portfolio), where 3dbruckner.de's prints are put in. Nothing here is
# published to the internet: portfolio listens on the server's private address, where the Caddy on gewerbe-1 passes requests on.
name: portfolio
services:
  portfolio:
    # main until portfolio has releases: every deployment pulls the newest (pull_policy), so an upgrade is a merge there and a deployment.
    image: ghcr.io/3d-bruckner/portfolio:main
    pull_policy: always
    container_name: portfolio
    # Monitored by Uptime Kuma (AutoKuma reads these labels), past Caddy, over the private network from gewerbe-1; the
    # public name is checked at Caddy there.
    labels:
      kuma.portfolio.http.name: portfolio (direct)
      kuma.portfolio.http.url: http://${PRIVATE_IP}:8083/health
      kuma.portfolio.http.parent_name: host-group
    restart: unless-stopped
    mem_limit: 512m
    # Every setting, secrets included, from .env (see .env.example).
    env_file: .env
    # portfolio.sqlite (the prints), auth.sqlite (sign-in), photos/ (originals, cutouts, thumbnails) and dumps/ (scripts/dump.sh).
    # The image runs as the owner of ./data (1000).
    volumes:
      - ./data:/data
    ports:
      - "${PRIVATE_IP:?this server's address on the private network}:8083:3000"
    security_opt:
      - no-new-privileges:true
    # The image has its own HEALTHCHECK on /health.
